[project]
name = "python-app-template"
version = "1.0.0"
description = "Template for a containerised Python application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
app = "app.main:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
